# MedContext Precision Oncology
# Biomedical Vocabulary v1.1
#
# Purpose:
# Controlled vocabulary for the MVP Candidate Finder, Precision Parser,
# synthetic-data generator, and downstream normalization.
#
# Notes:
# - This is intentionally not exhaustive.
# - "canonical" is the normalized entity name used internally by MedContext.
# - "aliases" contains common surface forms that may appear in reports.
# - Drug-target associations are metadata only and must NOT be used to infer
#   that a molecular alteration is present in a patient.

version: "1.1"

